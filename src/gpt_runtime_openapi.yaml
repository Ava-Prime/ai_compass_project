openapi: 3.0.0
info:
  title: GPT Runtime API
  version: 1.0.0
  description: API for GPT Agents to log memory, queue prompts, and call each other.

servers:
  - url: https://gpt-runtime.onrender.com

paths:
  /call_agent:
    post:
      summary: Call another agent and simulate a response
      operationId: callAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        '200':
          description: Simulated response

  /log_event:
    post:
      summary: Log an event to the memory journal
      operationId: logEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEvent"
      responses:
        '200':
          description: Event logged

  /queue_prompt:
    post:
      summary: Queue a prompt for an agent
      operationId: queuePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        '200':
          description: Prompt queued

  /memory_journal:
    get:
      summary: Retrieve memory journal
      operationId: getMemory
      responses:
        '200':
          description: List of memory events

  /prompt_queue:
    get:
      summary: Retrieve queued prompts
      operationId: getPromptQueue
      responses:
        '200':
          description: List of queued prompts

  /clear_prompt_queue:
    post:
      summary: Clear the prompt queue
      operationId: clearPromptQueue
      responses:
        '200':
          description: Queue cleared

components:
  schemas:
    AgentRequest:
      type: object
      properties:
        agent_name:
          type: string
        input_prompt:
          type: string
    LogEvent:
      type: object
      properties:
        source:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    PromptRequest:
      type: object
      properties:
        agent_name:
          type: string
        prompt:
          type: string
        priority:
          type: integer

